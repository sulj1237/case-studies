<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="680" height="468" role="img" aria-label="약국 플랫폼과 파트너몰 연동의 Route, Consent, Data, State, Log 5단계 설계 기준">
  <!-- 680px 폭에서 1:1. 글자 크기는 본문 정책과 같다: 라벨 16 · 본문 14 · 보조 13 · 머리말 12 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <rect class="on" x="0" y="0" width="680" height="60" rx="10"/>
    <text x="20" y="26" class="k" fill="#0f5c56">01 ROUTE</text>
    <text x="20" y="46" class="l">가입 경로</text>
    <text x="200" y="36" class="s">협력도매 약정 · 일반 메뉴 · 기존 회원</text>
    <line x1="110" y1="61" x2="110" y2="74" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="76" width="680" height="60" rx="10"/>
    <text x="20" y="102" class="k" fill="#0f5c56">02 CONSENT</text>
    <text x="20" y="122" class="l">동의 확인</text>
    <text x="200" y="112" class="s">제3자 제공 동의 · 주문 연동 동의</text>
    <line x1="110" y1="137" x2="110" y2="150" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="152" width="680" height="60" rx="10"/>
    <text x="20" y="178" class="k" fill="#0f5c56">03 DATA</text>
    <text x="20" y="198" class="l">전달 정보</text>
    <text x="200" y="188" class="s">필요한 회원 · 약국 관련 정보만 전달</text>
    <line x1="110" y1="213" x2="110" y2="226" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="228" width="680" height="60" rx="10"/>
    <text x="20" y="254" class="k" fill="#0f5c56">04 STATE</text>
    <text x="20" y="274" class="l">진행 상태</text>
    <text x="200" y="264" class="s">신청 · 약정 · VIP 적용 · 완료</text>
    <line x1="110" y1="289" x2="110" y2="302" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="304" width="680" height="60" rx="10"/>
    <text x="20" y="330" class="k" fill="#0f5c56">05 LOG</text>
    <text x="20" y="350" class="l">동의 기록</text>
    <text x="200" y="340" class="s">동의 시각 · IP · 동의 항목</text>

    <rect class="bx" x="0" y="392" width="680" height="76" rx="10"/>
    <text x="20" y="422" class="s" font-weight="600">기존 가입·주문 흐름은 유지하고, 정보가 전달되는 조건을 5단계 기준으로 설계</text>
    <text x="20" y="448" class="m">필요한 동의 이후에 필요한 정보만 전달하도록 기준을 연결한다.</text>
  </g>
</svg>
