<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" role="img" aria-label="플랫폼 회원 약국 회원 비회원의 관계와 앱 미설치 사각지대">
  <!-- 680px 폭에서 1:1 로 보이도록 그렸다. 글자 크기는 본문 정책과 같다: 라벨 16 · 본문 14 · 보조 13 · 머리말 12 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .h{font-size:15px;font-weight:700;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .w{font-size:13px;font-weight:600;fill:#9a5b1e}
    .n{font-size:20px;font-weight:600;fill:#16181c;font-variant-numeric:tabular-nums}
    .op{font-size:20px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
    .gap{fill:#fbf3ea;stroke:#9a5b1e;stroke-opacity:.5}
    .wr{fill:#fdf6ee;stroke:#9a5b1e;stroke-opacity:.4}
    .ln{stroke:#b9b8b2;stroke-width:1.2;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <text x="0" y="16" class="k">회원 유형과 가능한 동작</text>
    <text x="350" y="50" class="k" text-anchor="middle">적립</text>
    <text x="450" y="50" class="k" text-anchor="middle">사용</text>
    <text x="585" y="50" class="k" text-anchor="middle">전제 조건</text>

    <rect class="on" x="0" y="62" width="680" height="88" rx="10"/>
    <text x="18" y="92" class="l">약국 회원 + 앱 설치</text>
    <text x="18" y="116" class="s">약관 동의 완료 ·</text>
    <text x="18" y="136" class="s">고객앱 바코드 제시 가능</text>
    <text x="350" y="112" class="l" fill="#0f5c56" text-anchor="middle">가능</text>
    <text x="450" y="112" class="l" fill="#0f5c56" text-anchor="middle">가능</text>
    <text x="585" y="102" class="s" text-anchor="middle">단골약국 등록 +</text>
    <text x="585" y="122" class="s" text-anchor="middle">바코드 인증</text>

    <rect class="wr" x="0" y="162" width="680" height="88" rx="10"/>
    <text x="18" y="192" class="l">약국 회원 · 앱 미설치</text>
    <text x="18" y="216" class="s">키오스크에서 전화번호로 가입 —</text>
    <text x="18" y="236" class="s">앱을 깔 이유가 없었다</text>
    <text x="350" y="212" class="l" fill="#0f5c56" text-anchor="middle">가능</text>
    <text x="450" y="212" class="l" fill="#9a5b1e" text-anchor="middle">불가</text>
    <text x="585" y="212" class="s" text-anchor="middle">인증 수단 없음</text>

    <rect class="bx" x="0" y="262" width="680" height="76" rx="10"/>
    <text x="18" y="292" class="l">비회원</text>
    <text x="18" y="316" class="s">약국별 약관에 동의하지 않은 상태</text>
    <text x="350" y="306" class="s" text-anchor="middle">불가 또는 제한</text>
    <text x="450" y="306" class="s" text-anchor="middle">불가</text>
    <text x="585" y="306" class="s" text-anchor="middle">키오스크 가입 유도</text>

    <text x="0" y="370" class="w">가운데 줄이 D3(앱 바코드 단일 인증)이 만든 사각지대다.</text>
    <text x="0" y="392" class="w">적립은 쌓이는데 쓸 수가 없다.</text>
  </g>
</svg>
