<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="현장 입력 값이 제출과 PC 반영을 거쳐 실제 재고가 되는 데이터 상태">
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:10.5px;font-weight:600;letter-spacing:.1em}
    .l{font-size:14px;font-weight:600;fill:#16181c}
    .s{font-size:11.5px;fill:#3f4249}
    .m{font-size:11.5px;fill:#82858d}
    .bx{fill:#fcfcfa;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.45}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <text x="0" y="16" class="k" fill="#82858d">보낸 값 — 재고는 그대로</text>
    <text x="740" y="16" class="k" fill="#0f5c56">실제 재고</text>

    <rect class="bx" x="0" y="30" width="140" height="120" rx="10"/>
    <text x="16" y="56" class="k" fill="#82858d">FIELD</text>
    <text x="16" y="80" class="l">현장</text>
    <text x="16" y="106" class="s">진열대 · 창고</text>
    <text x="16" y="124" class="s">바코드 스캔</text>

    <line x1="144" y1="90" x2="160" y2="90" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="bx" x="164" y="30" width="140" height="120" rx="10"/>
    <text x="180" y="56" class="k" fill="#82858d">MOBILE INPUT</text>
    <text x="180" y="80" class="l">약사앱 입력</text>
    <text x="180" y="106" class="s">진열 + 창고</text>
    <text x="180" y="124" class="s">= 총 수량 자동</text>

    <line x1="308" y1="90" x2="324" y2="90" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="bx" x="328" y="30" width="140" height="120" rx="10"/>
    <text x="344" y="56" class="k" fill="#82858d">SUBMISSION</text>
    <text x="344" y="80" class="l">제출 · 반영전</text>
    <text x="344" y="106" class="s">전체 성공 또는</text>
    <text x="344" y="124" class="s">전체 실패</text>

    <line x1="472" y1="90" x2="488" y2="90" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="bx" x="492" y="30" width="140" height="120" rx="10"/>
    <text x="508" y="56" class="k" fill="#82858d">PC REVIEW</text>
    <text x="508" y="80" class="l">PC 확인</text>
    <text x="508" y="106" class="s">전산 · 총 수량 ·</text>
    <text x="508" y="124" class="s">차이 비교 · 선택</text>

    <line x1="682" y1="0" x2="682" y2="160" stroke="#0f5c56" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="636" y1="90" x2="732" y2="90" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="656" y="80" class="k" fill="#0f5c56">반영</text>

    <rect class="on" x="736" y="30" width="224" height="120" rx="10"/>
    <text x="752" y="56" class="k" fill="#0f5c56">INVENTORY REFLECTION</text>
    <text x="752" y="80" class="l" fill="#0f5c56">전산상 재고 = 총 수량</text>
    <text x="752" y="106" class="s">덮어쓰기 · 반영완료 기록</text>
    <text x="752" y="124" class="s">앱 기준 스냅샷 함께 보관</text>

    <text x="0" y="196" class="k" fill="#82858d">상태 — 제출 뒤 한 건이 갈 수 있는 길</text>
    <rect class="bx" x="0" y="208" width="225" height="60" rx="8"/>
    <text x="16" y="232" class="l">반영전</text>
    <text x="16" y="252" class="m">PC 미처리 · 재고 변화 없음</text>
    <rect class="on" x="245" y="208" width="225" height="60" rx="8"/>
    <text x="261" y="232" class="l" fill="#0f5c56">반영완료</text>
    <text x="261" y="252" class="m">체크 후 반영 · 재고 변경</text>
    <rect class="bx" x="490" y="208" width="225" height="60" rx="8"/>
    <text x="506" y="232" class="l">반영반려</text>
    <text x="506" y="252" class="m">반영 시 미체크 · 재고 변화 없음</text>
    <rect class="bx" x="735" y="208" width="225" height="60" rx="8"/>
    <text x="751" y="232" class="l">반영실패</text>
    <text x="751" y="252" class="m">시스템 오류 · 반영전으로 재시도</text>

    <text x="0" y="304" class="s" font-weight="600">경계는 하나 — PC의 반영. 그 왼쪽은 보낸 값, 오른쪽만 실제 재고다.</text>
  </g>
</svg>
