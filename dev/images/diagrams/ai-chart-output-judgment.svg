<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" aria-label="처방 데이터에서 AI 정리 결과를 거쳐 약사 판단으로 이어지는 역할 구분">
  <!-- 680px 폭에서 1:1 로 보이도록 그렸다. 글자 크기는 본문 정책과 같다: 라벨 16 · 본문 14 · 보조 13 · 머리말 12 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .h{font-size:15px;font-weight:700;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .w{font-size:13px;font-weight:600;fill:#9a5b1e}
    .n{font-size:20px;font-weight:600;fill:#16181c;font-variant-numeric:tabular-nums}
    .op{font-size:20px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
    .gap{fill:#fbf3ea;stroke:#9a5b1e;stroke-opacity:.5}
    .wr{fill:#fdf6ee;stroke:#9a5b1e;stroke-opacity:.4}
    .ln{stroke:#b9b8b2;stroke-width:1.2;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <rect class="bx" x="0" y="0" width="680" height="128" rx="10"/>
    <text x="20" y="32" class="k" fill="#82858d">INPUT · 처방 데이터</text>
    <text x="20" y="60" class="l">함께 불러오는 기록</text>
    <text x="20" y="92" class="m">기존에는 약사가 직접</text>
    <text x="20" y="110" class="m">찾아 맞대어 봄</text>
    <text x="286" y="34" class="s">· 현재 처방</text>
    <text x="286" y="58" class="s">· 이전 처방</text>
    <text x="286" y="82" class="s">· 같은 의사의 과거 처방</text>
    <text x="286" y="106" class="s">· 장기 복용 중인 약</text>
    <line x1="340" y1="130" x2="340" y2="154" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="bx" x="0" y="156" width="680" height="128" rx="10"/>
    <text x="20" y="188" class="k" fill="#82858d">AI OUTPUT · 판단 재료</text>
    <text x="20" y="216" class="l">변화와 맥락을 정리</text>
    <text x="20" y="248" class="m">결론 문장 대신</text>
    <text x="20" y="266" class="m">확인할 순서를 제시</text>
    <text x="286" y="190" class="s">· 무엇이 달라졌나</text>
    <text x="286" y="214" class="s">· 어떤 맥락의 변화인가</text>
    <text x="286" y="238" class="s">· 상담 전에 먼저 볼 정보</text>
    <text x="286" y="262" class="s">· 복용 중인 약 전체 관점</text>
    <line x1="0" y1="304" x2="680" y2="304" stroke="#9a5b1e" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="286" y="294" width="108" height="20" fill="#fcfcfa"/>
    <text x="340" y="309" class="k" fill="#9a5b1e" text-anchor="middle">책임 경계</text>
    <line x1="340" y1="286" x2="340" y2="290" stroke="#82858d" stroke-width="1.5"/>
    <line x1="340" y1="316" x2="340" y2="330" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="332" width="680" height="128" rx="10"/>
    <text x="20" y="364" class="k" fill="#0f5c56">HUMAN JUDGMENT · 약사</text>
    <text x="20" y="392" class="l" fill="#0f5c56">확인 · 판단 · 상담</text>
    <text x="20" y="424" class="m" fill="#0f5c56">AI 결과는 이 판단을</text>
    <text x="20" y="442" class="m" fill="#0f5c56">빠르게 만드는 재료</text>
    <text x="286" y="366" class="s">· 정리된 변화를 확인</text>
    <text x="286" y="390" class="s">· 환자 상태를 보고 무엇을 안내할지 결정</text>
    <text x="286" y="414" class="s">· 복약 상담 진행</text>
    <text x="286" y="438" class="s">· 최종 판단과 책임은 약사</text>

    <text x="0" y="498" class="k">화면 순서 — 시간 제약을 반영</text>
    <rect class="bx" x="0" y="512" width="332" height="86" rx="8"/>
    <text x="18" y="540" class="s" font-weight="600">위 · 기본 약 목록</text>
    <text x="18" y="564" class="m">즉시 표시 — 상담을 바로 시작</text>
    <rect class="bx" x="348" y="512" width="332" height="86" rx="8"/>
    <text x="366" y="540" class="s" font-weight="600">아래 · AI 분석 결과</text>
    <text x="366" y="564" class="m">필요 시 실행 · 뒤이어 표시 —</text>
    <text x="366" y="582" class="m">응답이 늦어도 기본 업무 진행</text>
  </g>
</svg>
