<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="파트너몰에서 약국 플랫폼으로 이어지는 가입·회원 연동과 약국 플랫폼에서 파트너몰로 이어지는 주문 흐름">
  <!-- 680px 폭에서 1:1. 글자 크기는 본문 정책과 같다: 라벨 16 · 본문 14 · 보조 13 · 머리말 12 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <rect class="bx" x="0" y="0" width="166" height="200" rx="12"/>
    <text x="18" y="32" class="k">PARTNER MALL</text>
    <text x="18" y="62" class="l">파트너몰</text>
    <text x="18" y="90" class="s">회원 약정 ·</text>
    <text x="18" y="110" class="s">상품 주문</text>

    <rect class="on" x="514" y="0" width="166" height="200" rx="12"/>
    <text x="530" y="32" class="k" fill="#0f5c56">PHARMACY</text>
    <text x="530" y="62" class="l">약국 플랫폼</text>
    <text x="530" y="90" class="s">회원 연동 ·</text>
    <text x="530" y="110" class="s">재고관리</text>

    <line x1="172" y1="64" x2="508" y2="64" stroke="#82858d" stroke-width="1.6" marker-end="url(#a)"/>
    <rect class="bx" x="184" y="42" width="312" height="44" rx="8"/>
    <text x="340" y="69" class="s" text-anchor="middle">파트너몰 → 약국 플랫폼 가입·회원 연동</text>

    <line x1="508" y1="140" x2="172" y2="140" stroke="#82858d" stroke-width="1.6" marker-end="url(#a)"/>
    <rect class="bx" x="184" y="118" width="312" height="44" rx="8"/>
    <text x="340" y="145" class="s" text-anchor="middle">약국 플랫폼 → 파트너몰 상품 주문</text>

    <text x="0" y="240" class="s" font-weight="600">기존 회원·주문 흐름을 유지하며,</text>
    <text x="0" y="262" class="s" font-weight="600">가입·약정·주문에서 정보가 전달되는 조건을 정의한다.</text>
    <text x="0" y="290" class="m">회원가입·약정·주문 과정의 개인정보와 회원 정보 전달 기준을 다룬 프로젝트</text>
  </g>
</svg>
