<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>콘텐츠 편집기</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg: #f6f6f4; --paper: #fff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e2e2dd;
    --accent: #2f5bd3; --accent-soft: #e9eefc; --danger: #c0392b; --ok: #1e8e5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; color: var(--ink); background: var(--bg); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 4px 10px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:disabled { opacity: .4; cursor: default; }
  button.icon { padding: 2px 7px; color: var(--muted); }
  button.danger:hover { color: var(--danger); border-color: var(--danger); }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--paper); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  aside h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 8px 12px; }
  .proj { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 7px 8px; margin-bottom: 2px; background: none; }
  .proj.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .proj small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .badge { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); margin-left: 4px; font-weight: 400; }
  main { padding: 0 28px 120px; min-width: 0; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .bar h2 { margin: 0 12px 0 0; font-size: 18px; }
  .bar .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 13px; }
  .status.dirty { color: var(--danger); }
  .status.saved { color: var(--ok); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 14px 0 18px; }
  .tab { border-radius: 999px; }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab.off { color: var(--muted); border-style: dashed; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .block-head { display: flex; align-items: center; gap: 6px; margin: -2px 0 10px; }
  .block-head .type { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .block-head .preview { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .card.collapsed > .fields { display: none; }
  .field { margin-bottom: 10px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  textarea, input[type=text], input[type=number], select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; }
  textarea { resize: vertical; min-height: 34px; line-height: 1.55; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .list-item { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 6px; }
  .list-item > .grow { flex: 1; min-width: 0; }
  .list-item > .ctrl { display: flex; flex-direction: column; gap: 2px; }
  .sub { border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 2px; background: #fbfbfa; }
  .grid-table { overflow-x: auto; }
  .grid-table table { border-collapse: collapse; width: 100%; }
  .grid-table td { padding: 2px; vertical-align: top; min-width: 140px; }
  .grid-table td.ctrl { min-width: 0; width: 1%; white-space: nowrap; }
  .grid-table tr:first-child td textarea.head { font-weight: 600; }
  .add { color: var(--accent); border-style: dashed; }
  .figure { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  .drop { border: 2px dashed var(--line); border-radius: 8px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; text-align: center; color: var(--muted); background: #fbfbfa; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop img { max-width: 100%; max-height: 260px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .drop .missing { color: var(--danger); font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .add-block { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .add-block select { width: auto; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal-box { background: var(--paper); border-radius: 12px; width: min(1100px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .modal-head input { flex: 1; }
  .gallery { overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .thumb { border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: #fbfbfa; text-align: left; }
  .thumb img { width: 100%; height: 120px; object-fit: contain; background: #fff; border-radius: 4px; }
  .thumb span { display: block; font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 4px; }
  .hint { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } .figure { grid-template-columns: 1fr; } main { padding: 0 16px 80px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Projects</h1>
    <div id="projects"></div>
  </aside>
  <main>
    <div class="bar">
      <h2 id="title">프로젝트를 고르세요</h2>
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <a id="view" target="_blank" rel="noreferrer"><button>사이트에서 보기 ↗</button></a>
      <button id="save" class="primary" disabled>저장 (⌘S)</button>
      <button id="publish" hidden disabled>발행</button>
      <button id="logout" class="icon" hidden title="이 브라우저에서 토큰 지우기">⎋</button>
    </div>
    <div id="tabs" class="tabs"></div>
    <div id="editor"><p class="empty">왼쪽에서 프로젝트를 고르면 내용을 고칠 수 있습니다.</p></div>
  </main>
</div>

<script type="module">
import { createGitHubBackend } from "./github.js";

/* ───────── 저장소 ─────────
 * 로컬(npm run edit)에서는 로컬 서버를, github.io 링크에서는 GitHub API 를 쓴다.
 * ?remote 를 붙이면 로컬에서도 GitHub 모드로 열린다. */
const REMOTE = location.hostname.endsWith("github.io") || new URLSearchParams(location.search).has("remote");
const TOKEN_KEY = "pf-editor-token";
const store = {
  get() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } },
  set(v) { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch {} },
};
function createLocalBackend() {
  return {
    remote: false,
    siteUrl: "",
    async init() { this.siteUrl = (await api("/api/config")).siteUrl; },
    projects: () => api("/api/projects"),
    project: (slug) => api(`/api/projects/${slug}`),
    async save(slug, files) {
      for (const [id, data] of Object.entries(files)) {
        const url = id === "meta" ? `/api/projects/${slug}/meta` : `/api/projects/${slug}/sections/${id}`;
        await api(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      }
    },
    async upload(slug, f) {
      return (await api(`/api/projects/${slug}/upload?name=${encodeURIComponent(f.name)}`, { method: "POST", body: f })).src;
    },
    images: () => api("/api/images"),
    imageUrl: async (src) => src + "?t=" + Date.now(),
  };
}
let B;

/** 이미지 칸에 실제 주소를 채운다 (GitHub 모드는 토큰으로 받아 온다) */
function showImage(img, src) {
  B.imageUrl(src).then((u) => (img.src = u)).catch(() => img.dispatchEvent(new Event("error")));
  return img;
}

/* ───────── 상태 ───────── */
const S = { siteUrl: "", projects: [], slug: null, data: null, tab: "meta", dirty: new Set(), images: [] };

const LABEL = {
  slug: "슬러그 (주소)", title: "제목", summary: "요약", order: "순서", tier: "묶음", period: "기간", phase: "단계",
  domain: "도메인", keySkill: "Key Skill", team: "팀", role: "역할", ownership: "담당", contribution: "기여",
  capability: "역량 한 줄", highlights: "하이라이트", value: "값", label: "라벨", scope: "범위", evidence: "근거",
  sections: "노출 섹션 (순서대로)", status: "상태", hidden: "숨김", relatedTo: "이어진 원래 케이스",
  text: "내용", caption: "설명", items: "항목", note: "메모", id: "번호", alternative: "대안", choice: "선택",
  why: "이유", tradeoff: "포기한 것", steps: "단계", actor: "주체", action: "하는 일", columns: "열 제목",
  rows: "행", highlight: "강조할 열 (0부터)", q: "질문", a: "답", src: "이미지 경로", alt: "대체 텍스트", size: "크기",
};
const ENUM = {
  status: ["draft", "ready"],
  tier: ["main", "short", "related"],
  size: ["full", "wide", "half", "phone"],
  scope: ["public", "local"],
};
const SIZE_HINT = { full: "가로 캡처 · 본문 폭", wide: "다이어그램 · 넓게", half: "가로 캡처 · 절반", phone: "세로 휴대폰 캡처" };
const SCOPE_HINT = { public: "공개 사이트에도 노출", local: "로컬에서만 (실서비스 캡처)" };

const TEMPLATES = {
  figure: () => ({ type: "figure", src: "", alt: "", caption: "", size: "full", scope: "local" }),
  lead: () => ({ type: "lead", text: "" }),
  heading: () => ({ type: "heading", text: "" }),
  text: () => ({ type: "text", text: "" }),
  note: () => ({ type: "note", text: "" }),
  quote: () => ({ type: "quote", text: "", caption: "" }),
  stats: () => ({ type: "stats", items: [{ value: "", label: "", note: "" }] }),
  decision: () => ({ type: "decision", id: "", title: "", alternative: "", choice: "", why: "", tradeoff: "" }),
  flow: () => ({ type: "flow", steps: [{ actor: "", action: "" }], note: "" }),
  compare: () => ({ type: "compare", columns: ["", "", ""], rows: [["", "", ""]] }),
  table: () => ({ type: "table", columns: ["", ""], rows: [["", ""]] }),
  cards: () => ({ type: "cards", items: [{ label: "", title: "", text: "" }] }),
  accordion: () => ({ type: "accordion", items: [{ q: "", a: "" }] }),
};
/* 비워 두면 저장할 때 빠지는 선택 항목 */
const OPTIONAL = new Set(["caption", "note", "alternative", "tradeoff", "relatedTo"]);

/* ───────── 도우미 ───────── */
const $ = (sel) => document.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }
function markDirty() { S.dirty.add(S.tab); updateBar(); }
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

/* ───────── 값 편집기 (재귀) ───────── */
function textBox(get, set, cls) {
  const t = h("textarea", { rows: 1, class: cls || "" });
  t.value = get() ?? "";
  t.addEventListener("input", () => { set(t.value); autosize(t); markDirty(); });
  requestAnimationFrame(() => autosize(t));
  return t;
}
function enumBox(key, get, set) {
  const s = h("select", { onchange: () => { set(s.value); markDirty(); } },
    ENUM[key].map((o) => h("option", { value: o, selected: get() === o }, o + (SIZE_HINT[o] && key === "size" ? ` — ${SIZE_HINT[o]}` : "") + (SCOPE_HINT[o] && key === "scope" ? ` — ${SCOPE_HINT[o]}` : ""))));
  return s;
}
function ctrl(arr, i, rerender) {
  return h("div", { class: "ctrl" },
    h("button", { class: "icon", title: "위로", onclick: () => { move(arr, i, -1); markDirty(); rerender(); } }, "↑"),
    h("button", { class: "icon", title: "아래로", onclick: () => { move(arr, i, 1); markDirty(); rerender(); } }, "↓"),
    h("button", { class: "icon danger", title: "삭제", onclick: () => { arr.splice(i, 1); markDirty(); rerender(); } }, "×"));
}
function blankLike(v) {
  if (Array.isArray(v)) return v.map(blankLike);
  if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, blankLike(x)]));
  return typeof v === "number" ? 0 : typeof v === "boolean" ? false : "";
}

function valueEditor(obj, key, parentKey) {
  const v = obj[key];
  const wrap = h("div");
  const rerender = () => wrap.replaceChildren(valueEditor(obj, key, parentKey));

  if (typeof key === "string" && ENUM[key] && (typeof v === "string" || v === undefined)) return enumBox(key, () => obj[key], (x) => (obj[key] = x));
  if (typeof v === "boolean") {
    const c = h("input", { type: "checkbox", checked: v, onchange: () => { obj[key] = c.checked; markDirty(); } });
    return h("label", {}, c, " 켜기");
  }
  if (typeof v === "number") {
    const n = h("input", { type: "number", value: v, oninput: () => { obj[key] = n.value === "" ? 0 : Number(n.value); markDirty(); } });
    return n;
  }
  if (Array.isArray(v)) {
    // 행 × 열 표
    if (key === "rows" && v.every(Array.isArray)) return tableEditor(obj, rerender);
    // 문자열 목록
    if (v.every((x) => typeof x === "string")) {
      wrap.append(...v.map((_, i) => h("div", { class: "list-item" },
        h("div", { class: "grow" }, textBox(() => v[i], (x) => (v[i] = x))), ctrl(v, i, rerender))));
      wrap.append(h("button", { class: "add", onclick: () => { v.push(""); markDirty(); rerender(); } }, "+ 추가"));
      return wrap;
    }
    // 객체 목록
    wrap.append(...v.map((item, i) => h("div", { class: "list-item" },
      h("div", { class: "grow sub" }, objectFields(item)), ctrl(v, i, rerender))));
    wrap.append(h("button", { class: "add", onclick: () => { v.push(blankLike(v[0] ?? { text: "" })); markDirty(); rerender(); } }, "+ 추가"));
    return wrap;
  }
  if (v && typeof v === "object") return h("div", { class: "sub" }, objectFields(v));
  return textBox(() => obj[key], (x) => (obj[key] = x));
}

function tableEditor(block, rerender) {
  const rows = block.rows;
  const cols = Math.max(block.columns?.length ?? 0, ...rows.map((r) => r.length));
  const table = h("table");
  if (block.columns) {
    table.append(h("tr", {}, block.columns.map((_, c) => h("td", {}, textBox(() => block.columns[c], (x) => (block.columns[c] = x), "head"))),
      h("td", { class: "ctrl" }, h("span", { class: "hint" }, "열 제목"))));
  }
  rows.forEach((r, i) => {
    while (r.length < cols) r.push("");
    table.append(h("tr", {}, r.map((_, c) => h("td", {}, textBox(() => r[c], (x) => (r[c] = x)))), h("td", { class: "ctrl" }, ctrl(rows, i, rerender))));
  });
  return h("div", {},
    h("div", { class: "grid-table" }, table),
    h("div", { class: "row", style: "max-width:360px;margin-top:6px" },
      h("button", { class: "add", onclick: () => { rows.push(Array(cols).fill("")); markDirty(); rerender(); } }, "+ 행"),
      h("button", { class: "add", onclick: () => { block.columns?.push(""); rows.forEach((r) => r.push("")); markDirty(); rerender(); } }, "+ 열"),
      h("button", { class: "add", onclick: () => { if (cols < 2) return; block.columns?.pop(); rows.forEach((r) => r.pop()); markDirty(); rerender(); } }, "− 열")));
}

function objectFields(obj, skip = []) {
  const frag = h("div", { class: "fields" });
  for (const key of Object.keys(obj)) {
    if (key === "type" || skip.includes(key)) continue;
    // 표의 열 제목은 행 편집기 첫 줄에서 함께 고친다
    if (key === "columns" && Array.isArray(obj.rows)) continue;
    frag.append(h("div", { class: "field" }, h("label", {}, LABEL[key] ? `${LABEL[key]} · ${key}` : key), valueEditor(obj, key, null)));
  }
  return frag;
}

/* ───────── 이미지 블록 ───────── */
/** 이미지 칸 — 끌어다 놓기 · 올리기 · 기존 이미지 고르기. onUpload 는 올린 파일을 받는다 */
function imageSlot(get, set, rerender, onUpload) {
  const src = get();
  const file = h("input", { type: "file", accept: "image/*", style: "display:none", onchange: () => file.files[0] && upload(file.files[0]) });
  const img = src ? showImage(h("img", { alt: "", onerror: (e) => e.target.replaceWith(h("div", { class: "missing" }, "파일을 찾을 수 없습니다")) }), src) : null;
  const drop = h("div", { class: "drop" },
    img ?? h("div", {}, "이미지를 여기로 끌어다 놓으세요"),
    h("div", { class: "row" },
      h("button", { onclick: () => file.click() }, "올리기"),
      h("button", { onclick: () => pickImage((x) => { set(x); markDirty(); rerender(); }) }, "기존 이미지")),
    h("div", { class: "hint" }, src || "이미지 없음"),
    file);

  async function upload(f) {
    drop.replaceChildren(h("div", {}, "올리는 중…"));
    try {
      set(await B.upload(S.slug, f));
      onUpload?.(f);
      S.images = [];
      markDirty();
    } catch (e) { alert("올리기 실패: " + e.message); }
    rerender();
  }
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) upload(f); });
  return drop;
}

function figureEditor(block, rerender) {
  // 없는 칸은 화면용 기본값으로 채우고, 그대로 두면 저장할 때 다시 뺀다
  const defaults = { alt: "", caption: "", size: "full", scope: "public" };
  for (const [k, d] of Object.entries(defaults)) if (!(k in block)) (block.__defaults ??= {})[k] = block[k] = d;
  const drop = imageSlot(() => block.src, (x) => (block.src = x), rerender,
    (f) => { if (!block.alt) block.alt = f.name.replace(/\.[^.]+$/, ""); });
  return h("div", { class: "fields figure" }, drop, h("div", {},
    h("div", { class: "field" }, h("label", {}, "설명 · caption"), valueEditor(block, "caption")),
    h("div", { class: "field" }, h("label", {}, "대체 텍스트 · alt"), valueEditor(block, "alt")),
    h("div", { class: "row" },
      h("div", { class: "field" }, h("label", {}, "크기 · size"), valueEditor(block, "size")),
      h("div", { class: "field" }, h("label", {}, "노출 · scope"), valueEditor(block, "scope")))));
}

/* ───────── 디자인 · 배치 ───────── */
/** 고를 거리 + '기본값'. 기본값을 고르면 키를 지워 사이트 기본을 따르게 한다 */
function choice(obj, key, options) {
  const s = h("select", { onchange: () => { if (s.value) obj[key] = s.value; else delete obj[key]; markDirty(); } },
    h("option", { value: "" }, "기본값"),
    options.map(([v, label]) => h("option", { value: v, selected: obj[key] === v }, label)));
  return s;
}
function colorField(obj, key, fallback) {
  const text = h("input", { type: "text", placeholder: `기본값 (${fallback})`, value: obj[key] ?? "" });
  const pick = h("input", { type: "color", value: obj[key] || fallback, style: "width:44px;padding:2px;height:34px" });
  const apply = (v) => { if (v) obj[key] = v; else delete obj[key]; markDirty(); };
  pick.addEventListener("input", () => { text.value = pick.value; apply(pick.value); });
  text.addEventListener("input", () => { if (/^#[0-9a-f]{6}$/i.test(text.value)) pick.value = text.value; apply(text.value.trim()); });
  return h("div", { style: "display:flex;gap:6px" }, pick, text,
    h("button", { title: "기본값으로", onclick: () => { text.value = ""; pick.value = fallback; apply(""); } }, "초기화"));
}
const LAYOUTS = [["editorial", "A. Editorial — 왼쪽 라벨 · 오른쪽 본문"], ["rail", "B. Rail — 왼쪽 고정 목차"], ["grid", "C. Grid — 한 열 세로"]];

function themeEditor(meta) {
  const card = h("div", { class: "card" });
  const render = () => {
    const t = (meta.theme ??= {});
    card.replaceChildren(
      h("div", { class: "block-head" }, h("span", { class: "type" }, "디자인"), h("span", { class: "preview" }, "이 프로젝트 페이지에만 적용됩니다")),
      h("div", { class: "fields figure" },
        h("div", {},
          h("div", { class: "field" }, h("label", {}, "커버 배경 이미지 · coverImage"),
            imageSlot(() => t.coverImage, (x) => (t.coverImage = x), render)),
          t.coverImage ? h("button", { class: "danger", onclick: () => { delete t.coverImage; markDirty(); render(); } }, "커버 이미지 빼기") : null),
        h("div", {},
          h("div", { class: "field" }, h("label", {}, "레이아웃 · layout"), choice(t, "layout", LAYOUTS)),
          h("div", { class: "field" }, h("label", {}, "페이지 배경색 · background"), colorField(t, "background", "#fcfcfa")),
          h("div", { class: "field" }, h("label", {}, "강조색 · accent"), colorField(t, "accent", "#0f5c56")),
          h("div", { class: "field" }, h("label", {}, `커버 이미지 가림 정도 · coverVeil — ${t.coverVeil ?? 70}%`), (() => {
            const r = h("input", { type: "range", min: 0, max: 95, step: 5, value: t.coverVeil ?? 70, style: "width:100%" });
            r.addEventListener("input", () => { t.coverVeil = Number(r.value); markDirty(); r.parentElement.querySelector("label").textContent = `커버 이미지 가림 정도 · coverVeil — ${r.value}%`; });
            return r;
          })()),
          h("p", { class: "hint" }, "가림 정도를 높이면 이미지가 흐려지고 제목 글씨가 잘 읽힙니다. 바탕색을 바꾸면 가림 색도 함께 바뀝니다."))));
  };
  render();
  return card;
}

function sectionLayoutEditor(section) {
  const l = (section.layout ??= {});
  return h("div", { class: "row" },
    h("div", { class: "field" }, h("label", {}, "배치 · columns (A안)"), choice(l, "columns", [["split", "나란히 — 왼쪽 제목 · 오른쪽 본문"], ["stack", "위아래 — 제목 아래 본문"]])),
    h("div", { class: "field" }, h("label", {}, "본문 폭 · width"), choice(l, "width", [["normal", "보통"], ["narrow", "좁게 — 읽기 폭"]])),
    h("div", { class: "field" }, h("label", {}, "위아래 여백 · spacing"), choice(l, "spacing", [["compact", "좁게"], ["normal", "보통"], ["loose", "넓게"]])));
}

async function pickImage(onPick) {
  if (!S.images.length) S.images = await B.images();
  const grid = h("div", { class: "gallery" });
  const search = h("input", { type: "text", placeholder: "파일 이름으로 찾기", oninput: () => fill() });
  const modal = h("div", { class: "modal", onclick: (e) => e.target === modal && modal.remove() },
    h("div", { class: "modal-box" }, h("div", { class: "modal-head" }, search, h("button", { onclick: () => modal.remove() }, "닫기")), grid));
  function fill() {
    const q = search.value.toLowerCase();
    grid.replaceChildren(...S.images.filter((s) => s.toLowerCase().includes(q)).map((src) =>
      h("button", { class: "thumb", onclick: () => { modal.remove(); onPick(src); } }, showImage(h("img", { alt: "", loading: "lazy" }), src), h("span", {}, src.replace("/images/", "")))));
  }
  fill();
  document.body.append(modal);
  search.focus();
}

/* ───────── 섹션 (블록 목록) ───────── */
function blockPreview(b) {
  const t = b.text || b.title || b.caption || b.src || (b.items?.[0] && (b.items[0].title || b.items[0].label || b.items[0].q)) || (b.steps?.[0]?.action) || (b.columns || []).filter(Boolean).join(" · ");
  return (t || "").replace(/\*\*/g, "");
}

function sectionEditor(section) {
  const box = h("div");
  const render = () => {
    box.replaceChildren();
    box.append(h("div", { class: "card" }, h("div", { class: "row" },
      h("div", { class: "field" }, h("label", {}, "섹션 제목 · title"), valueEditor(section, "title")),
      h("div", { class: "field", style: "max-width:160px" }, h("label", {}, "상태 · status"), valueEditor(section, "status"))),
      sectionLayoutEditor(section)));
    const blocks = (section.blocks ??= []);
    blocks.forEach((b, i) => {
      const card = h("div", { class: "card" + (b.__open === false ? " collapsed" : "") });
      const rerender = () => render();
      card.append(h("div", { class: "block-head" },
        h("button", { class: "icon", title: "접기/펴기", onclick: () => { b.__open = b.__open === false; card.classList.toggle("collapsed"); } }, "▾"),
        h("span", { class: "type" }, b.type), h("span", { class: "preview" }, blockPreview(b)),
        h("button", { class: "icon", title: "아래에 블록 추가", onclick: () => addBlockAt(i + 1) }, "+"),
        ...ctrl(blocks, i, rerender).children));
      card.append(b.type === "figure" ? figureEditor(b, rerender) : objectFields(b));
      box.append(card);
    });
    const typeSel = h("select", {}, Object.keys(TEMPLATES).map((t) => h("option", { value: t }, t)));
    box.append(h("div", { class: "add-block" }, typeSel, h("button", { class: "add", onclick: () => addBlockAt(blocks.length, typeSel.value) }, "+ 블록 추가")));

    function addBlockAt(i, type) {
      type ??= prompt("블록 종류: " + Object.keys(TEMPLATES).join(", "), "figure");
      if (!type || !TEMPLATES[type]) return;
      blocks.splice(i, 0, TEMPLATES[type]());
      markDirty(); render();
    }
  };
  render();
  return box;
}

/* ───────── 기본 정보 ───────── */
function metaEditor(meta) {
  if (!("hidden" in meta)) meta.hidden = false;
  const wrap = h("div");
  wrap.append(themeEditor(meta));
  const box = h("div", { class: "card" });
  wrap.append(box);
  box.append(objectFields(meta, ["theme"]));
  box.append(h("p", { class: "hint" }, "노출 섹션: 위 목록에 있는 섹션만 순서대로 사이트에 나옵니다. 숨김을 켜면 목록·주소·빌드에서 빠집니다."));
  return wrap;
}

/* ───────── 화면 ───────── */
function updateBar() {
  const n = S.dirty.size;
  $("#save").disabled = !n;
  const st = $("#status");
  st.className = "status" + (n ? " dirty" : "");
  st.textContent = n ? `저장 안 됨 (${[...S.dirty].map((t) => (t === "meta" ? "기본 정보" : t)).join(", ")})` : st.dataset.saved || "";
}
function renderProjects() {
  $("#projects").replaceChildren(...S.projects.map((p) =>
    h("button", { class: "proj" + (p.slug === S.slug ? " active" : ""), onclick: () => openProject(p.slug) },
      p.title, p.hidden ? h("span", { class: "badge" }, "숨김") : null, h("small", {}, p.slug))));
}
function renderTabs() {
  const listed = S.data.meta.sections || [];
  const ids = [...listed, ...Object.keys(S.data.sections).filter((id) => !listed.includes(id))];
  $("#tabs").replaceChildren(
    h("button", { class: "tab" + (S.tab === "meta" ? " active" : ""), onclick: () => setTab("meta") }, "기본 정보"),
    ...ids.filter((id) => S.data.sections[id]).map((id) => h("button", {
      class: "tab" + (S.tab === id ? " active" : "") + (listed.includes(id) ? "" : " off"),
      title: listed.includes(id) ? "" : "노출 섹션 목록에 없어 사이트에는 나오지 않습니다",
      onclick: () => setTab(id) }, id + (S.dirty.has(id) ? " •" : ""))));
}
function setTab(id) {
  S.tab = id;
  renderTabs();
  $("#editor").replaceChildren(id === "meta" ? metaEditor(S.data.meta) : sectionEditor(S.data.sections[id]));
  $("#view").href = `${B.siteUrl}/projects/${S.slug}${B.remote ? "/" : ""}`;
  window.scrollTo(0, 0);
}
async function openProject(slug) {
  if (S.dirty.size && !confirm("저장하지 않은 내용이 있습니다. 버리고 이동할까요?")) return;
  S.slug = slug; S.dirty.clear(); S.tab = "meta";
  S.data = await B.project(slug);
  $("#title").textContent = S.data.meta.title;
  $("#status").dataset.saved = "";
  location.hash = slug;
  renderProjects(); setTab("meta"); updateBar();
}

function clean(v) {
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === "object") {
    const out = {};
    for (const [k, x] of Object.entries(v)) {
      if (k.startsWith("__")) continue;
      if (v.__defaults && k in v.__defaults && x === v.__defaults[k]) continue;
      if (OPTIONAL.has(k) && x === "") continue;
      if (k === "hidden" && x === false) continue;
      if ((k === "theme" || k === "layout") && x && typeof x === "object" && !Array.isArray(x) && !Object.keys(x).length) continue;
      out[k] = clean(x);
    }
    return out;
  }
  return v;
}
async function save() {
  if (!S.dirty.size) return;
  $("#save").disabled = true;
  try {
    const files = {};
    for (const id of S.dirty) files[id] = clean(id === "meta" ? S.data.meta : S.data.sections[id]);
    await B.save(S.slug, files);
    S.dirty.clear();
    $("#status").dataset.saved = `저장됨 ${new Date().toLocaleTimeString("ko-KR")} — ` + (B.remote ? "발행하면 개발 사이트에 반영" : "사이트 새로고침하면 반영");
    $("#status").classList.add("saved");
    S.projects = await B.projects();
    refreshPending();
    $("#title").textContent = S.data.meta.title;
    renderProjects(); renderTabs();
  } catch (e) { alert("저장 실패: " + e.message); }
  updateBar();
  if (!S.dirty.size) $("#status").classList.add("saved");
}

$("#save").addEventListener("click", save);
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", (e) => { if (S.dirty.size) e.preventDefault(); });

/* ───────── 발행 (GitHub 모드) ───────── */
async function refreshPending() {
  if (!B?.remote) return;
  const n = await B.pending().catch(() => 0);
  $("#publish").disabled = n === 0;
  $("#publish").textContent = n ? `발행 (${n})` : "발행";
  $("#publish").title = n ? `저장된 수정 ${n}건을 개발 사이트(develop)에 내보냅니다` : "발행할 수정이 없습니다";
}
async function publish() {
  if (S.dirty.size && !confirm("저장하지 않은 내용은 발행되지 않습니다. 계속할까요?")) return;
  if (!confirm("저장한 수정을 개발 사이트(develop)에 내보낼까요? 몇 분 뒤 반영됩니다.")) return;
  $("#publish").disabled = true;
  try {
    await B.publish();
    const st = $("#status");
    st.dataset.saved = "발행함 — 개발 사이트는 몇 분 뒤 바뀝니다";
    st.replaceChildren(st.dataset.saved, " · ", h("a", { href: `${B.repoUrl}/actions`, target: "_blank", rel: "noreferrer" }, "배포 진행 보기"));
    st.className = "status saved";
  } catch (e) { alert("발행 실패: " + e.message); }
  refreshPending();
}

function tokenScreen(message) {
  const input = h("input", { type: "password", placeholder: "github_pat_…", autocomplete: "off" });
  const go = async () => { store.set(input.value.trim()); location.reload(); };
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  $("#editor").replaceChildren(h("div", { class: "card", style: "max-width:560px" },
    h("h3", { style: "margin-top:0" }, "GitHub 토큰으로 열기"),
    message ? h("p", { class: "missing" }, message) : null,
    h("p", {}, "이 편집기는 비공개 저장소 sulj1237/PF_private 을 직접 고칩니다. 이 브라우저에서 한 번만 넣으면 기억합니다. 본인 기기에서만 쓰세요."),
    h("div", { class: "field" }, h("label", {}, "토큰 — PF_private 의 Contents 읽기·쓰기 권한"), input),
    h("div", { class: "row", style: "max-width:320px" },
      h("button", { class: "primary", onclick: go }, "열기"),
      h("a", { href: "https://github.com/settings/personal-access-tokens/new", target: "_blank", rel: "noreferrer" }, h("button", {}, "토큰 만들기 ↗")))));
  input.focus();
}

(async () => {
  if (REMOTE) {
    const token = store.get();
    if (!token) return tokenScreen();
    B = createGitHubBackend({ token });
    $("#publish").hidden = false;
    $("#publish").addEventListener("click", publish);
    $("#logout").hidden = false;
    $("#logout").addEventListener("click", () => { if (confirm("이 브라우저에서 토큰을 지울까요?")) { store.set(""); location.reload(); } });
    $("#editor").replaceChildren(h("p", { class: "empty" }, "불러오는 중…"));
  } else {
    B = createLocalBackend();
  }
  try {
    await B.init();
    S.projects = await B.projects();
  } catch (e) {
    if (REMOTE && (e.status === 401 || e.status === 403 || e.status === 404)) { store.set(""); return tokenScreen(e.status === 401 ? e.message : "이 토큰으로는 PF_private 을 고칠 수 없습니다. 권한을 확인하세요"); }
    $("#editor").replaceChildren(h("p", { class: "missing" }, "불러오지 못했습니다: " + e.message));
    return;
  }
  $("#editor").replaceChildren(h("p", { class: "empty" }, "왼쪽에서 프로젝트를 고르면 내용을 고칠 수 있습니다."));
  renderProjects();
  refreshPending();
  const start = location.hash.slice(1);
  if (S.projects.some((p) => p.slug === start)) openProject(start);
})();
</script>
</body>
</html>
