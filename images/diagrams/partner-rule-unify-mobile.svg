    <text x="14" y="77" class="m">개별 기준 · 개별 동의</text>
    <rect class="bx" x="176" y="30" width="164" height="62" rx="10"/>
    <text x="190" y="56" class="l">로그인</text>
    <text x="190" y="77" class="m">개별 기준 · 개별 동의</text>
    <rect class="bx" x="0" y="104" width="164" height="62" rx="10"/>
    <text x="14" y="130" class="l">주문</text>
    <text x="14" y="151" class="m">개별 기준 · 개별 동의</text>
    <rect class="bx" x="176" y="104" width="164" height="62" rx="10"/>
    <text x="190" y="130" class="l">제휴 가입</text>
    <text x="190" y="151" class="m">개별 기준 · 개별 동의</text>

    <path d="M170 182V214" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="0" y="244" class="k" fill="#0f5c56">AFTER · 5단계 공통 규칙</text>
    <rect class="on" x="0" y="258" width="340" height="44" rx="10"/>
    <circle cx="26" cy="280" r="12" fill="#0f5c56"/>
    <text x="26" y="285" class="num" text-anchor="middle">1</text>
    <text x="52" y="286" class="l">경로</text>
    <line x1="170" y1="303" x2="170" y2="314" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="316" width="340" height="44" rx="10"/>
    <circle cx="26" cy="338" r="12" fill="#0f5c56"/>
    <text x="26" y="343" class="num" text-anchor="middle">2</text>
    <text x="52" y="344" class="l">동의</text>
    <line x1="170" y1="361" x2="170" y2="372" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="0" y="374" width="340" height="44" rx="10"/>
    <circle cx="26" cy="396" r="12" fill="#0f5c56"/>
    <text x="26" y="401" class="num" text-anchor="middle">3</text>
