<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="680" height="344" role="img" aria-label="적립 기준을 전액으로 할 때와 실결제액으로 할 때의 비교">
  <!-- 680px 폭에서 1:1 로 보이도록 그렸다. 글자 크기는 본문 정책과 같다: 라벨 16 · 본문 14 · 보조 13 · 머리말 12 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .h{font-size:15px;font-weight:700;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .w{font-size:13px;font-weight:600;fill:#9a5b1e}
    .n{font-size:20px;font-weight:600;fill:#16181c;font-variant-numeric:tabular-nums}
    .op{font-size:20px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
    .gap{fill:#fbf3ea;stroke:#9a5b1e;stroke-opacity:.5}
    .wr{fill:#fdf6ee;stroke:#9a5b1e;stroke-opacity:.4}
    .ln{stroke:#b9b8b2;stroke-width:1.2;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <rect class="wr" x="0" y="0" width="680" height="160" rx="10"/>
    <text x="20" y="32" class="h" fill="#9a5b1e">전액 기준 — 채택하지 않음</text>
    <text x="20" y="72" class="k">결제금액</text><text x="20" y="100" class="n">10,000</text>
    <text x="112" y="98" class="op">−</text>
    <text x="142" y="72" class="k">사용 포인트</text><text x="142" y="100" class="n">2,000</text>
    <text x="244" y="98" class="op">→</text>
    <text x="280" y="72" class="k">적립 기준</text><text x="280" y="100" class="n" fill="#9a5b1e">10,000</text>
    <text x="376" y="98" class="op">×</text>
    <text x="406" y="72" class="k">적립률 5%</text><text x="406" y="100" class="n">= 500P</text>
    <text x="20" y="138" class="s">쓴 포인트까지 적립 대상이 된다 → 포인트가 포인트를 낳아 지급량이 불어난다.</text>
    <path d="M500 94 C 566 94 566 60 500 60" fill="none" stroke="#9a5b1e" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="572" y="82" class="w">순환</text>

    <rect class="on" x="0" y="184" width="680" height="160" rx="10"/>
    <text x="20" y="216" class="h" fill="#0f5c56">실제 결제 잔액 기준 — 채택</text>
    <text x="20" y="256" class="k">결제금액</text><text x="20" y="284" class="n">10,000</text>
    <text x="112" y="282" class="op">−</text>
    <text x="142" y="256" class="k">사용 포인트</text><text x="142" y="284" class="n">2,000</text>
    <text x="244" y="282" class="op">→</text>
    <text x="280" y="256" class="k">적립 기준</text><text x="280" y="284" class="n" fill="#0f5c56">8,000</text>
    <text x="376" y="282" class="op">×</text>
    <text x="406" y="256" class="k">적립률 5%</text><text x="406" y="284" class="n">= 400P</text>
    <text x="20" y="322" class="s">약국이 실제로 받은 금액만 적립 대상이다. 매출과 적립액이 어긋나지 않는다.</text>
  </g>
</svg>
