<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" role="img" aria-label="기능마다 따로였던 전달 기준을 경로 동의 전달 상태 기록 5단계 공통 규칙으로 통합">
  <!-- 680px 폭에서 1:1. 모바일은 partner-rule-unify-mobile.svg 로 바뀐다 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
    .num{font-size:13px;font-weight:700;fill:#fff}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <text x="0" y="16" class="k">BEFORE · 기능마다 따로 판단</text>
    <rect class="bx" x="0" y="30" width="156" height="78" rx="10"/>
    <text x="16" y="60" class="l">가입</text>
    <text x="16" y="86" class="m">개별 기준 · 개별 동의</text>
    <rect class="bx" x="172" y="30" width="156" height="78" rx="10"/>
    <text x="188" y="60" class="l">로그인</text>
    <text x="188" y="86" class="m">개별 기준 · 개별 동의</text>
    <rect class="bx" x="344" y="30" width="156" height="78" rx="10"/>
    <text x="360" y="60" class="l">주문</text>
    <text x="360" y="86" class="m">개별 기준 · 개별 동의</text>
    <rect class="bx" x="516" y="30" width="156" height="78" rx="10"/>
    <text x="532" y="60" class="l">제휴 가입</text>
    <text x="532" y="86" class="m">개별 기준 · 개별 동의</text>

    <path d="M340 116V160" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="354" y="144" class="m">하나의 규칙으로</text>

    <text x="0" y="190" class="k" fill="#0f5c56">AFTER · 5단계 공통 규칙</text>
    <rect class="on" x="0" y="204" width="116" height="76" rx="10"/>
    <circle cx="58" cy="230" r="12" fill="#0f5c56"/>
    <text x="58" y="235" class="num" text-anchor="middle">1</text>
    <text x="58" y="266" class="l" text-anchor="middle">경로</text>
    <line x1="118" y1="242" x2="138" y2="242" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="140" y="204" width="116" height="76" rx="10"/>
    <circle cx="198" cy="230" r="12" fill="#0f5c56"/>
    <text x="198" y="235" class="num" text-anchor="middle">2</text>
    <text x="198" y="266" class="l" text-anchor="middle">동의</text>
    <line x1="258" y1="242" x2="278" y2="242" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="280" y="204" width="116" height="76" rx="10"/>
    <circle cx="338" cy="230" r="12" fill="#0f5c56"/>
    <text x="338" y="235" class="num" text-anchor="middle">3</text>
    <text x="338" y="266" class="l" text-anchor="middle">전달</text>
    <line x1="398" y1="242" x2="418" y2="242" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="420" y="204" width="116" height="76" rx="10"/>
    <circle cx="478" cy="230" r="12" fill="#0f5c56"/>
    <text x="478" y="235" class="num" text-anchor="middle">4</text>
    <text x="478" y="266" class="l" text-anchor="middle">상태</text>
    <line x1="538" y1="242" x2="558" y2="242" stroke="#0f5c56" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="560" y="204" width="116" height="76" rx="10"/>
    <circle cx="618" cy="230" r="12" fill="#0f5c56"/>
    <text x="618" y="235" class="num" text-anchor="middle">5</text>
    <text x="618" y="266" class="l" text-anchor="middle">기록</text>
    <text x="0" y="310" class="m">가입 · 로그인 · 주문 · 제휴 가입 모두 같은 순서로 확인한다</text>
  </g>
</svg>
