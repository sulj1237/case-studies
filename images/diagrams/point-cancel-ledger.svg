<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="결제 취소 시 포인트 원장 처리와 예외 분기">
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .h{font-size:12.5px;font-weight:700;fill:#16181c}
    .k{font-size:10.5px;font-weight:600;fill:#82858d;letter-spacing:.1em}
    .l{font-size:13px;font-weight:600;fill:#16181c}
    .s{font-size:11.5px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
  </style>
  <g class="t">
    <text x="0" y="14" class="k">원거래</text>
    <rect class="bx" x="0" y="28" width="300" height="92" rx="8"/>
    <text x="20" y="56" class="l">결제 8,000 + 포인트 2,000</text>
    <text x="20" y="80" class="s">적립 400P 지급됨</text>
    <text x="20" y="102" class="s">거래번호로 식별</text>

    <path d="M300 74 H392" stroke="#c9c8c2" stroke-width="1"/>
    <text x="316" y="66" class="s">전체 취소</text>

    <rect x="392" y="14" width="290" height="56" rx="8" fill="#e9f1ef" stroke="#0f5c56" stroke-opacity=".4"/>
    <text x="412" y="40" class="l" fill="#0f5c56">사용 포인트 2,000 복구</text>
    <text x="412" y="58" class="s">고객 잔액으로 되돌린다</text>

    <rect x="392" y="82" width="290" height="56" rx="8" fill="#fdf6ee" stroke="#9a5b1e" stroke-opacity=".35"/>
    <text x="412" y="108" class="l" fill="#9a5b1e">적립 포인트 400 회수</text>
    <text x="412" y="126" class="s">지급분을 되가져온다</text>

    <path d="M300 74 V42 H392" fill="none" stroke="#c9c8c2" stroke-width="1"/>
    <path d="M300 74 V110 H392" fill="none" stroke="#c9c8c2" stroke-width="1"/>

    <text x="0" y="176" class="k">정상 처리되지 않는 경우</text>
    <g>
      <rect class="bx" x="0"   y="192" width="308" height="106" rx="8"/>
      <rect class="bx" x="326" y="192" width="308" height="106" rx="8"/>
      <rect class="bx" x="652" y="192" width="308" height="106" rx="8"/>
      <text x="20"  y="220" class="h">복구 대상이 이미 만료</text>
      <text x="20"  y="246" class="s">만료는 시간 기준으로 이미</text>
      <text x="20"  y="264" class="s">확정된 상태다.</text>
      <text x="20"  y="286" class="s" fill="#9a5b1e">→ 복원되지 않을 수 있음</text>

      <text x="346" y="220" class="h">회수할 잔액이 부족</text>
      <text x="346" y="246" class="s">이미 다른 곳에 써버린 경우</text>
      <text x="346" y="264" class="s">잔액을 음수로 두지 않는다.</text>
      <text x="346" y="286" class="s" fill="#9a5b1e">→ 자동 조정 포인트로 표기</text>

      <text x="672" y="220" class="h">부분 환불 요청</text>
      <text x="672" y="246" class="s">라운딩 규칙·차감 우선순위가</text>
      <text x="672" y="264" class="s">확정돼야 성립한다.</text>
      <text x="672" y="286" class="s" fill="#9a5b1e">→ 전체 취소 후 재결제</text>
    </g>
    <text x="0" y="336" class="s">마이너스 잔액은 실제 부채로 관리하지 않는다 — 플랫폼은 시스템 제공자이며 부채 주체가 아니다.</text>
  </g>
</svg>
