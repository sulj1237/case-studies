<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" role="img" aria-label="법률 요구사항이 서비스 규칙 상태 화면 시스템 기록으로 바뀌는 순서">
  <!-- 680px 폭에서 1:1 로 보이도록 그렸다. 글자 크기는 본문 정책과 같다: 라벨 16 · 본문 14 · 보조 13 · 머리말 12 -->
  <style>
    .t{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#82858d}
    .l{font-size:16px;font-weight:600;fill:#16181c}
    .h{font-size:15px;font-weight:700;fill:#16181c}
    .s{font-size:14px;fill:#3f4249}
    .m{font-size:13px;fill:#82858d}
    .w{font-size:13px;font-weight:600;fill:#9a5b1e}
    .n{font-size:20px;font-weight:600;fill:#16181c;font-variant-numeric:tabular-nums}
    .op{font-size:20px;fill:#82858d}
    .bx{fill:#f5f4f1;stroke:#e5e4df}
    .on{fill:#e9f1ef;stroke:#0f5c56;stroke-opacity:.4}
    .gap{fill:#fbf3ea;stroke:#9a5b1e;stroke-opacity:.5}
    .wr{fill:#fdf6ee;stroke:#9a5b1e;stroke-opacity:.4}
    .ln{stroke:#b9b8b2;stroke-width:1.2;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#82858d"/></marker>
  </defs>
  <g class="t">
    <rect class="bx" x="0" y="0" width="212" height="152" rx="10"/>
    <text x="18" y="30" class="k" fill="#82858d">01 LEGAL</text>
    <text x="18" y="58" class="l">법률 요구</text>
    <text x="18" y="88" class="s">제3자 제공 동의</text>
    <text x="18" y="108" class="s">항목 · 목적 ·</text>
    <text x="18" y="128" class="s">보유기간 고지</text>
    <line x1="214" y1="76" x2="232" y2="76" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="234" y="0" width="212" height="152" rx="10"/>
    <text x="252" y="30" class="k" fill="#0f5c56">02 RULE</text>
    <text x="252" y="58" class="l" fill="#0f5c56">서비스 규칙</text>
    <text x="252" y="88" class="s">경로 → 동의 →</text>
    <text x="252" y="108" class="s">전달 항목 순서</text>
    <text x="252" y="128" class="s">고정</text>
    <line x1="448" y1="76" x2="466" y2="76" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="468" y="0" width="212" height="152" rx="10"/>
    <text x="486" y="30" class="k" fill="#0f5c56">03 STATE</text>
    <text x="486" y="58" class="l" fill="#0f5c56">상태</text>
    <text x="486" y="88" class="s">회원 구분 · 자격</text>
    <text x="486" y="108" class="s">동의 여부 ·</text>
    <text x="486" y="128" class="s">가입 진행 상태</text>
    <rect class="on" x="0" y="178" width="212" height="152" rx="10"/>
    <text x="18" y="208" class="k" fill="#0f5c56">04 UI GATE</text>
    <text x="18" y="236" class="l" fill="#0f5c56">화면 진행 조건</text>
    <text x="18" y="266" class="s">동의 + 가입 신청</text>
    <text x="18" y="286" class="s">완료 시 약정</text>
    <text x="18" y="306" class="s">신청서 제출</text>
    <line x1="214" y1="254" x2="232" y2="254" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="234" y="178" width="212" height="152" rx="10"/>
    <text x="252" y="208" class="k" fill="#0f5c56">05 DATA</text>
    <text x="252" y="236" class="l" fill="#0f5c56">전달 조건</text>
    <text x="252" y="266" class="s">전달 시점에</text>
    <text x="252" y="286" class="s">동의 상태 확인</text>
    <text x="252" y="306" class="s">후 정보 전달</text>
    <line x1="448" y1="254" x2="466" y2="254" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>
    <rect class="on" x="468" y="178" width="212" height="152" rx="10"/>
    <text x="486" y="208" class="k" fill="#0f5c56">06 LOG</text>
    <text x="486" y="236" class="l" fill="#0f5c56">동의 기록</text>
    <text x="486" y="266" class="s">동의 시각</text>
    <text x="486" y="286" class="s">접속 IP</text>
    <text x="486" y="306" class="s">동의 항목</text>
    <path d="M574 152V164H106V176" fill="none" stroke="#82858d" stroke-width="1.5" marker-end="url(#a)"/>

    <rect class="bx" x="0" y="356" width="680" height="132" rx="10"/>
    <text x="20" y="386" class="k" fill="#9a5b1e">체크박스 방식과의 차이</text>
    <text x="20" y="414" class="s">체크박스는 01 → 04 만 연결한다.</text>
    <text x="20" y="436" class="s">정보가 실제로 넘어가는 순간(05)은 화면 뒤 시스템 처리라서,</text>
    <text x="20" y="458" class="s">그 시점에 동의 상태를 확인하도록 규칙을 이어야</text>
    <text x="20" y="480" class="s">동의 없는 전달이 실제로 막힌다.</text>
  </g>
</svg>
